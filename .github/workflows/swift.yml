name: Swift SDK

on:
  push:
    paths:
      - ".github/workflows/swift.yml"
      - "platforms/swift/**"
      - "specs/**"
      - "third_party/**"
      - "tools/ci/**"
      - "tools/release/**"
  pull_request:
    paths:
      - ".github/workflows/swift.yml"
      - "platforms/swift/**"
      - "specs/**"
      - "third_party/**"
      - "tools/ci/**"
      - "tools/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swift:
    name: Swift 6.3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04

    defaults:
      run:
        working-directory: platforms/swift

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure libsmb2 paths
        run: |
          echo "STELLAR_LIBSMB2_PREFIX=$RUNNER_TEMP/stellar-libsmb2" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/stellar-libsmb2/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Verify Swift 6.3 toolchain
        run: |
          swift --version
          swift --version | grep -E "Swift version 6\.3\."

      - name: Verify libsmb2 provenance
        run: python3 ../../tools/ci/check_libsmb2_binding.py --root ../..

      - name: Build isolated static libsmb2
        if: runner.os == 'Linux'
        run: >-
          ../../tools/ci/build_libsmb2_static_linux.sh
          --lock ../../third_party/libsmb2.lock.json
          --prefix "$STELLAR_LIBSMB2_PREFIX"

      - name: Verify prefixed static libsmb2 C ABI
        if: runner.os == 'Linux'
        run: python3 ../../tools/ci/check_libsmb2_binding.py --root ../.. --require-installed

      - name: Lint Swift format
        run: swift format lint --recursive --strict Sources Tests Package.swift

      - name: Verify reproducible Swift dependencies
        run: python3 ../../tools/ci/check_swift_dependencies.py --package-root .

      - name: Check public API compatibility baseline
        run: python3 ../../tools/ci/check_swift_api.py --package-root . --baseline API/PublicAPI.json

      - name: Run debug and shared fixture tests
        run: swift test -c debug

      - name: Build release SDK and CLI
        run: swift build -c release

      - name: Verify release SMB static isolation
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary=.build/release/stellar-media
          nm --defined-only "$binary" |
            grep 'stellar_user_media_sdk_libsmb2_smb2_init_context'
          if nm -D -g --defined-only "$binary" |
            grep 'stellar_user_media_sdk_libsmb2_'; then
            echo "private libsmb2 symbols leaked into the release dynamic export table" >&2
            exit 1
          fi
          if ldd "$binary" | grep -i 'libsmb2'; then
            echo "release binary unexpectedly depends on shared libsmb2" >&2
            exit 1
          fi

      - name: Build and verify LGPL source/object relink kit
        if: runner.os == 'Linux'
        run: >-
          ../../tools/release/create_linux_smb_lgpl_kit.sh
          --root ../..
          --package-root .
          --libsmb2-prefix "$STELLAR_LIBSMB2_PREFIX"
          --output "$RUNNER_TEMP/stellar-linux-smb-lgpl-kit"

      - name: Smoke-test release CLI
        run: |
          swift run -c release stellar-media version
          swift run -c release stellar-media parse "The.Matrix.1999.2160p.mkv"
          swift run -c release stellar-media manifest replay \
            ../../specs/fixtures/media-library/scanner-state-v1.json | \
            grep "stellar.scan-manifest-replay.v1"
          swift run -c release stellar-media help | grep "stellar-media smb check"

  repository-guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked content for high-confidence secrets
        run: python3 tools/ci/secret_scan.py --root .

      - name: Reject Apple frameworks in portable Swift targets
        run: python3 tools/ci/check_portable_swift_imports.py --root .

      - name: Verify libsmb2 lock and binding boundary
        run: python3 tools/ci/check_libsmb2_binding.py --root .
