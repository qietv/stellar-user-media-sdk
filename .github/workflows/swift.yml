name: Swift SDK

on:
  push:
    paths:
      - ".github/workflows/swift.yml"
      - "platforms/swift/**"
      - "specs/**"
      - "third_party/**"
      - "tools/ci/**"
  pull_request:
    paths:
      - ".github/workflows/swift.yml"
      - "platforms/swift/**"
      - "specs/**"
      - "third_party/**"
      - "tools/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swift:
    name: Swift 6.3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04

    defaults:
      run:
        working-directory: platforms/swift

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure libsmb2 paths
        run: |
          echo "STELLAR_LIBSMB2_PREFIX=$RUNNER_TEMP/stellar-libsmb2" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/stellar-libsmb2/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Verify Swift 6.3 toolchain
        run: |
          swift --version
          swift --version | grep -E "Swift version 6\.3\."

      - name: Verify libsmb2 provenance
        run: python3 ../../tools/ci/check_libsmb2_binding.py --root ../..

      - name: Build isolated static libsmb2
        if: runner.os == 'Linux'
        run: >-
          ../../tools/ci/build_libsmb2_static_linux.sh
          --lock ../../third_party/libsmb2.lock.json
          --prefix "$STELLAR_LIBSMB2_PREFIX"

      - name: Verify prefixed static libsmb2 C ABI
        if: runner.os == 'Linux'
        run: python3 ../../tools/ci/check_libsmb2_binding.py --root ../.. --require-installed

      - name: Lint Swift format
        run: swift format lint --recursive --strict Sources Tests Package.swift

      - name: Verify reproducible Swift dependencies
        run: python3 ../../tools/ci/check_swift_dependencies.py --package-root .

      - name: Check public API compatibility baseline
        run: python3 ../../tools/ci/check_swift_api.py --package-root . --baseline API/PublicAPI.json

      - name: Run debug and shared fixture tests
        run: swift test -c debug

      - name: Build release SDK and CLI
        run: swift build -c release

      - name: Run isolated Samba integration smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends samba

          fixture_root="$RUNNER_TEMP/stellar-smb-fixture"
          samba_config="$RUNNER_TEMP/stellar-smb.conf"
          scan_output="$RUNNER_TEMP/stellar-smb-scan.jsonl"
          mkdir -p "$fixture_root/Movies/Science Fiction" "$fixture_root/Empty"
          install -m 0644 /dev/null "$fixture_root/Movies/Science Fiction/Arrival 2016.mkv"
          install -m 0644 /dev/null "$fixture_root/Movies/你好🌟.mkv"

          if ! id -u stellarci >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin stellarci
          fi
          sudo chown -R stellarci "$fixture_root"
          smb_password="$(openssl rand -base64 24)"
          wrong_password="$(openssl rand -base64 24)"
          echo "::add-mask::$smb_password"
          echo "::add-mask::$wrong_password"
          printf '%s\n%s\n' "$smb_password" "$smb_password" |
            sudo smbpasswd -s -a stellarci >/dev/null

          cat >"$samba_config" <<EOF
          [global]
            bind interfaces only = yes
            interfaces = lo
            logging = file
            log file = $RUNNER_TEMP/stellar-smbd.log
            map to guest = never
            server min protocol = SMB2_10
            server max protocol = SMB3_11
            smb ports = 1445

          [Media]
            path = $fixture_root
            read only = yes
            valid users = stellarci
          EOF

          sudo smbd --foreground --no-process-group --configfile="$samba_config" \
            >"$RUNNER_TEMP/stellar-smbd.stdout" 2>&1 &
          samba_pid=$!
          trap 'sudo kill "$samba_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if (echo >/dev/tcp/127.0.0.1/1445) >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              echo "temporary Samba server did not start" >&2
              exit 1
            fi
            sleep 1
          done

          cli=.build/release/stellar-media
          printf '%s\n' "$smb_password" | "$cli" smb check \
            --server 127.0.0.1 --port 1445 --share Media \
            --username stellarci --password-stdin --signing required
          printf '%s\n' "$smb_password" | "$cli" smb check \
            --server 127.0.0.1 --port 1445 --share Media \
            --username stellarci --password-stdin --version 3 --encryption required
          printf '%s\n' "$smb_password" | "$cli" smb list \
            --server 127.0.0.1 --port 1445 --share Media \
            --username stellarci --password-stdin >/dev/null
          printf '%s\n' "$smb_password" | "$cli" smb scan \
            --server 127.0.0.1 --port 1445 --share Media \
            --username stellarci --password-stdin >"$scan_output"

          if printf '%s\n' "$wrong_password" | "$cli" smb check \
            --server 127.0.0.1 --port 1445 --share Media \
            --username stellarci --password-stdin \
            >"$RUNNER_TEMP/stellar-smb-wrong.stdout" \
            2>"$RUNNER_TEMP/stellar-smb-wrong.stderr"; then
            echo "wrong SMB credential unexpectedly succeeded" >&2
            exit 1
          fi

          python3 - "$scan_output" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines()]
          summary = records[-1]
          if summary["schema"] != "stellar.smb.scan-summary.v1":
              raise SystemExit("SMB scan did not finish with a summary")
          if summary["result"] != "complete" or summary["file_count"] != 2:
              raise SystemExit("SMB scan summary is incomplete")
          serialized = path.read_text(encoding="utf-8")
          for forbidden in ("127.0.0.1", "stellarci", "Arrival", "你好"):
              if forbidden in serialized:
                  raise SystemExit("SMB scan output contains sensitive source metadata")
          PY

      - name: Smoke-test release CLI
        run: |
          swift run -c release stellar-media version
          swift run -c release stellar-media parse "The.Matrix.1999.2160p.mkv"
          swift run -c release stellar-media help | grep "stellar-media smb check"

  repository-guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked content for high-confidence secrets
        run: python3 tools/ci/secret_scan.py --root .

      - name: Reject Apple frameworks in portable Swift targets
        run: python3 tools/ci/check_portable_swift_imports.py --root .

      - name: Verify libsmb2 lock and binding boundary
        run: python3 tools/ci/check_libsmb2_binding.py --root .
