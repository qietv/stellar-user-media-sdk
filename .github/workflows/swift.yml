name: Swift SDK

on:
  push:
    paths:
      - ".github/workflows/swift.yml"
      - "platforms/swift/**"
      - "specs/**"
      - "tools/ci/**"
      - "tools/release/**"
  pull_request:
    paths:
      - ".github/workflows/swift.yml"
      - "platforms/swift/**"
      - "specs/**"
      - "tools/ci/**"
      - "tools/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-swift:
    name: Swift 6.3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04

    defaults:
      run:
        working-directory: platforms/swift

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Swift 6.3 toolchain
        run: |
          swift --version
          swift --version | grep -E "Swift version 6\.3\."

      - name: Lint Swift format
        run: swift format lint --recursive --strict Sources Tests Package.swift

      - name: Verify reproducible Swift dependencies
        run: python3 ../../tools/ci/check_swift_dependencies.py --package-root .

      - name: Check public API compatibility baseline
        run: python3 ../../tools/ci/check_swift_api.py --package-root . --baseline API/PublicAPI.json

      - name: Check screenshot API compatibility baseline
        if: runner.os == 'macOS'
        run: >-
          python3 ../../tools/ci/check_swift_api.py
          --package-root .
          --baseline API/StellarMediaImagingAPI.json
          --module StellarMediaImaging

      - name: Run debug and shared fixture tests
        run: swift test -c debug

      - name: Build release SDK and CLI
        run: swift build -c release

      - name: Build Apple SMB product for iOS device and simulator
        if: runner.os == 'macOS'
        run: |
          xcodebuild -quiet \
            -scheme StellarSMB2 \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/stellar-smb2-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild -quiet \
            -scheme StellarSMB2 \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/stellar-smb2-iphonesimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build screenshot product for iOS device and simulator
        if: runner.os == 'macOS'
        run: |
          xcodebuild -quiet \
            -scheme StellarMediaImaging \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/stellar-imaging-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild -quiet \
            -scheme StellarMediaImaging \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/stellar-imaging-iphonesimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Smoke-test release CLI
        run: |
          swift run -c release stellar-media version
          swift run -c release stellar-media parse "The.Matrix.1999.2160p.mkv"
          swift run -c release stellar-media manifest replay \
            ../../specs/fixtures/media-library/scanner-state-v1.json | \
            grep "stellar.scan-manifest-replay.v1"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            swift run -c release stellar-media help | grep "stellar-media smb check"
          fi
          swift run -c release stellar-media help | grep "stellar-media db migrate"
          swift run -c release stellar-media help | grep "stellar-media library list"
          swift run -c release stellar-media help | grep "stellar-media library search"
          swift run -c release stellar-media help | grep "stellar-media library show"

  repository-guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked content for high-confidence secrets
        run: python3 tools/ci/secret_scan.py --root .

      - name: Reject Apple frameworks in portable Swift targets
        run: python3 tools/ci/check_portable_swift_imports.py --root .

      - name: Execute cross-platform SQLite schemas
        run: python3 tools/ci/check_sqlite_schemas.py --root .

      - name: Verify generated Swift SQLite schemas
        run: >-
          python3 tools/storage/generate_swift_sql_schemas.py
          --root .
          --output platforms/swift/Sources/StellarStorage/GeneratedSchemas.swift
          --check

      - name: Test repository guards
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
